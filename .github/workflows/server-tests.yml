name: Stirling PDF server tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: PDF server (login ${{ matrix.login }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        login: ["true", "false"]
    services:
      stirling:
        image: stirlingtools/stirling-pdf:3.2.0@sha256:10164ffe04961b02ebc9fa4da12064eeacb8d3bc3e09ceb059f78ce7aaa83207
        ports:
          - 8080:8080
        env:
          DOCKER_ENABLE_SECURITY: "true"
          SECURITY_ENABLELOGIN: ${{ matrix.login }}
          SECURITY_INITIALLOGIN_USERNAME: ci-admin
          SECURITY_INITIALLOGIN_PASSWORD: ci-test-password
          SECURITY_CUSTOMGLOBALAPIKEY: ci-test-key-not-a-secret
          SYSTEM_ENABLEANALYTICS: "false"
        options: >-
          --memory=4g
          --health-cmd "curl -fsS http://localhost:8080/api/v1/info/status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 90s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-live.txt
      - name: Install server-test dependencies
        run: python -m pip install -r requirements-live.txt
      - name: Test real PDF processing and authentication
        env:
          STIRLING_PDF_URL: http://127.0.0.1:8080
          STIRLING_PDF_API_KEY: ci-test-key-not-a-secret
          STIRLING_PDF_REQUIRE_AUTH: ${{ matrix.login }}
        run: python -m pytest -q -p no:cacheprovider tests_live
      - name: Show server logs on failure
        if: failure()
        run: docker logs "${{ job.services.stirling.id }}"
