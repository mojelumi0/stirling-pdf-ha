name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.9.0"
            requirements: requirements-dev-min.txt
          - homeassistant: "2026.10.2"
            requirements: requirements-dev.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "${{ matrix.requirements }}"
      - name: Verify the Home Assistant version under test
        env:
          EXPECTED_HA_VERSION: ${{ matrix.homeassistant }}
        run: >-
          python -c 'import importlib.metadata, os;
          assert importlib.metadata.version("homeassistant") == os.environ["EXPECTED_HA_VERSION"]'
      - name: Run tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          --cov=custom_components/stirling_pdf
          --cov-report=term-missing
          --cov-fail-under=90
      - name: Run Ruff
        run: ruff check --no-cache custom_components tests tests_live
      - name: Check Ruff formatting
        run: ruff format --check --no-cache custom_components tests tests_live

  pytest:
    name: pytest
    if: always()
    needs: compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Require both Home Assistant versions to pass
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: test "$COMPATIBILITY_RESULT" = success
