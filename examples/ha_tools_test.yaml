alias: Stirling PDF - Additional tool test
description: >-
  Tests six selected standard actions for exactly one server using a.pdf.
  No sensitive, external or AI action opt-ins are required. Creates its own new
  outputs without overwriting, deleting, reloading or restarting.
mode: single
icon: mdi:file-document-check-outline
fields:
  config_entry_id:
    name: Stirling PDF server
    required: true
    selector:
      config_entry:
        integration: stirling_pdf
  test_directory:
    name: Test directory containing a.pdf
    default: /config/pdf-test
    selector:
      text:
sequence:
  - variables:
      directory: "{{ test_directory | default('/config/pdf-test', true) | trim | regex_replace('/+$', '') }}"
      selected_server: "{{ config_entry_id }}"
      selected_entities: "{{ config_entry_entities(selected_server) }}"
      jobs_candidates: >-
        {{ expand(selected_entities)
           | selectattr('attributes.state_class', 'defined')
           | selectattr('attributes.state_class', 'eq', 'total_increasing')
           | map(attribute='entity_id') | list }}
      run_id: "{{ now().strftime('%Y%m%d_%H%M%S_%f') }}"
      results: []
  - if: "{{ not directory.startswith('/config/') or '..' in directory.split('/') or jobs_candidates | count != 1 }}"
    then:
      - stop: No unique server job-counter sensor or invalid test directory. No PDF action was started.
        error: true
  - variables:
      jobs_entity: "{{ jobs_candidates | first }}"
      start_count: "{{ states(jobs_entity) | int(-1) }}"
      prefix: "{{ directory }}/stirling_tools_{{ run_id }}"
  - if: "{{ start_count < 0 }}"
    then:
      - stop: The job-counter sensor does not report a number. No PDF action was started.
        error: true
  - variables:
      test_cases:
        - operation: rotate
          data:
            file_path: "{{ directory }}/a.pdf"
            angle: 90
            output_path: "{{ prefix }}_rotated.pdf"
        - operation: repair
          data:
            file_path: "{{ directory }}/a.pdf"
            output_path: "{{ prefix }}_repaired.pdf"
        - operation: metadata
          data:
            file_path: "{{ directory }}/a.pdf"
            delete_all: false
            title: Stirling PDF synthetic acceptance test
            output_path: "{{ prefix }}_metadata.pdf"
        - operation: watermark
          data:
            file_path: "{{ directory }}/a.pdf"
            watermark_type: text
            watermark_text: STIRLING TEST
            output_path: "{{ prefix }}_watermark.pdf"
        - operation: analyze_page_count
          data:
            file_path: "{{ directory }}/a.pdf"
        - operation: check_contains_text
          data:
            file_path: "{{ directory }}/a.pdf"
            text: "STIRLING_ABSENT_{{ run_id }}"
  - repeat:
      for_each: "{{ test_cases }}"
      sequence:
        - variables:
            before_count: "{{ states(jobs_entity) | int(-1) }}"
            reply: {}
        - alias: Call additional tool and capture response
          action: "stirling_pdf.{{ repeat.item.operation }}"
          data: "{{ dict(repeat.item.data, config_entry_id=selected_server, overwrite=false) }}"
          response_variable: reply
          continue_on_error: true
        - wait_template: "{{ states(jobs_entity) | int(-1) != before_count }}"
          timeout: "00:00:03"
          continue_on_timeout: true
        - variables:
            after_count: "{{ states(jobs_entity) | int(-1) }}"
            ok: >-
              {{ reply is mapping and reply.get('operation') == repeat.item.operation
                 and reply.get('config_entry_id') == selected_server
                 and after_count == before_count + 1
                 and (reply.get('output_size', 0) | int(0) > 0
                      if repeat.item.operation not in ['analyze_page_count', 'check_contains_text']
                      else reply.get('result', {}).get('pageCount', 0) | int(0) > 0
                      if repeat.item.operation == 'analyze_page_count'
                      else reply.get('matches') == false) }}
            results: >-
              {{ results + [dict(operation=repeat.item.operation, ok=ok,
                 before=before_count, after=after_count,
                 output=reply.get('output_path', '') if reply is mapping else '')] }}
  - action: persistent_notification.create
    data:
      title: Stirling PDF - Additional tool test report
      message: >-
        **Test run:** {{ run_id }}

        **Server entry:** {{ selected_server }}

        **OK:** {{ results | selectattr('ok', 'eq', true) | list | count }} / {{ test_cases | count }}

        {% for result in results %}
        - {{ result.operation }}: {{ 'OK' if result.ok else 'FAILED - check trace' }}.
        Counter {{ result.before }} -> {{ result.after }}.
        {{ result.output }}

        {% endfor %}

        **Counter:** {{ start_count }} -> {{ states(jobs_entity) }}.
        Expected for a fully successful run: {{ start_count + test_cases | count }}.

        Open the four PDFs and manually compare rotation, page contents, metadata
        title and watermark. The other server's statistics must not have changed.
        Do not rerun this script for persistence checks. There is no automatic
        version verification, OCR assessment, security assessment or merge approval.
        This script tests six standard actions, not the entire catalog or any
        sensitive, external or AI tools.
