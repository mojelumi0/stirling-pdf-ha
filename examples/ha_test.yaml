alias: Stirling PDF - Integration test
description: >-
  Manual integration test using a.pdf and b.pdf. Creates its own output files,
  checks action responses and statistics sensors, and displays a report.
  Overwrites only a test output it created earlier, never a.pdf or b.pdf.
  Does not reload, restart or delete files.
  Does not automatically verify the installed integration version.
icon: mdi:file-document-check-outline
mode: single
fields:
  config_entry_id:
    name: Stirling PDF server
    description: Required when multiple servers are configured. Tests only this entry.
    selector:
      config_entry:
        integration: stirling_pdf
  include_extract_pages:
    name: Include page extraction
    description: Disable only if the installed integration does not support this action yet.
    default: true
    selector:
      boolean:
  reported_version:
    name: Installed integration version (manual entry)
    description: Optionally copy this from diagnostics. It is not verified automatically.
    default: ""
    selector:
      text:
  deployment_label:
    name: Deployment label (optional)
    description: For example, Community App or standalone server. Do not enter credentials.
    default: ""
    selector:
      text:
  test_directory:
    name: PDF test directory
    description: HA path to the already allowlisted directory containing a.pdf and b.pdf.
    default: /config/pdf-test
    selector:
      text:
sequence:
  - alias: Prepare the test run and sensor discovery
    variables:
      directory: >-
        {{ test_directory | default('/config/pdf-test', true)
           | trim | regex_replace('/+$', '') }}
      run_id: "{{ now().strftime('%Y%m%d_%H%M%S_%f') }}"
      extract_enabled: "{{ include_extract_pages | default(true) | bool }}"
      selected_server: "{{ config_entry_id if config_entry_id is string else '' }}"
      selected_entities: >-
        {% if selected_server %}
          {% set matching = namespace(entities=[]) %}
          {% if config_entry_attr(selected_server, 'domain') == 'stirling_pdf' %}
            {% for entity_id in integration_entities(config_entry_attr(selected_server, 'title')) %}
              {% if (entity_id | config_entry_id) == selected_server %}
                {% set matching.entities = matching.entities + [entity_id] %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ matching.entities }}
        {% else %}
          {{ integration_entities('stirling_pdf') }}
        {% endif %}
      jobs_candidates: >-
        {{ expand(selected_entities)
           | selectattr('attributes.state_class', 'defined')
           | selectattr('attributes.state_class', 'eq', 'total_increasing')
           | map(attribute='entity_id') | list }}
      last_candidates: >-
        {{ expand(selected_entities)
           | selectattr('attributes.device_class', 'defined')
           | selectattr('attributes.device_class', 'eq', 'enum')
           | map(attribute='entity_id') | list }}
      reachable_candidates: >-
        {{ expand(selected_entities)
           | selectattr('attributes.device_class', 'defined')
           | selectattr('attributes.device_class', 'eq', 'connectivity')
           | map(attribute='entity_id') | list }}
      results: []
      successful_operations: []
  - alias: Stop safely if the test directory or sensors are ambiguous
    if: >-
      {{ not directory.startswith('/config/')
         or '..' in directory.split('/')
         or jobs_candidates | count != 1
         or last_candidates | count != 1
         or reachable_candidates | count != 1 }}
    then:
      - action: persistent_notification.create
        data:
          title: Stirling PDF - Test not started
          message: >-
            Select exactly one server if multiple servers are configured,
            specify a subdirectory of /config, and enable both
            statistics sensors and the integration's reachability sensor.
            Discovered job-counter sensors: {{ jobs_candidates }}.
            Discovered last-operation sensors: {{ last_candidates }}.
            Discovered reachability sensors: {{ reachable_candidates }}.
      - stop: Test prerequisites are missing; no PDF action was executed.
  - variables:
      jobs_entity: "{{ jobs_candidates | first }}"
      last_entity: "{{ last_candidates | first }}"
      reachable_entity: "{{ reachable_candidates | first }}"
      start_count: "{{ states(jobs_entity) | int(-1) }}"
      prefix: "{{ directory }}/stirling_test_{{ run_id }}"
      notification_id: "stirling_pdf_test_{{ run_id }}"
  - if: "{{ start_count < 0 }}"
    then:
      - action: persistent_notification.create
        data:
          title: Stirling PDF - Test not started
          message: "The job-counter sensor {{ jobs_entity }} does not report a number."
      - stop: No valid starting value; no PDF action was executed.
  - alias: Do not start test actions until reachability is confirmed
    if: "{{ not is_state(reachable_entity, 'on') }}"
    then:
      - action: persistent_notification.create
        data:
          title: Stirling PDF - Test not started
          message: >-
            {{ reachable_entity }} reports {{ states(reachable_entity) }}.
            Check the connection and credentials first. After restoring access,
            wait for the next status poll (normally about 60 seconds).
            No PDF action was executed.
      - stop: Reachability is not confirmed; no PDF action was executed.
  - alias: Use only this run's own files as output targets
    variables:
      test_cases:
        - name: Merge
          operation: merge
          expect: success
          available: true
          input_count: 2
          data:
            file_paths:
              - "{{ directory }}/a.pdf"
              - "{{ directory }}/b.pdf"
            output_path: "{{ prefix }}_merged.pdf"
            overwrite: false
        - name: Split
          operation: split
          expect: success
          available: true
          requires: merge
          input_count: 1
          data:
            file_path: "{{ prefix }}_merged.pdf"
            page_numbers: "1"
            output_path: "{{ prefix }}_split.zip"
            overwrite: false
        - name: OCR
          operation: ocr
          expect: success
          available: true
          requires: merge
          input_count: 1
          data:
            file_path: "{{ directory }}/a.pdf"
            languages:
              - eng
            output_path: "{{ prefix }}_ocr.pdf"
            overwrite: false
        - name: Compress
          operation: compress
          expect: success
          available: true
          requires: merge
          input_count: 1
          data:
            file_path: "{{ directory }}/a.pdf"
            optimize_level: 5
            output_path: "{{ prefix }}_compressed.pdf"
            overwrite: false
        - name: Existing test output without overwrite
          operation: compress
          expect: rejection
          available: true
          requires: compress
          expected_error: The output file already exists.
          data:
            file_path: "{{ directory }}/a.pdf"
            output_path: "{{ prefix }}_compressed.pdf"
            overwrite: false
        - name: Explicitly overwrite only this run's own test output
          operation: compress
          expect: success
          available: true
          requires: compress
          input_count: 1
          data:
            file_path: "{{ directory }}/a.pdf"
            optimize_level: 5
            output_path: "{{ prefix }}_compressed.pdf"
            overwrite: true
        - name: Wrong compression output extension
          operation: compress
          expect: rejection
          available: true
          requires: compress
          expected_error: The output must use the .pdf extension.
          data:
            file_path: "{{ directory }}/a.pdf"
            output_path: "{{ prefix }}_wrong_compress.zip"
            overwrite: false
        - name: Wrong split output extension
          operation: split
          expect: rejection
          available: true
          requires: split
          expected_error: The output must use the .zip extension.
          data:
            file_path: "{{ directory }}/a.pdf"
            page_numbers: "1"
            output_path: "{{ prefix }}_wrong_split.pdf"
            overwrite: false
        - name: Missing output directory
          operation: compress
          expect: rejection
          available: true
          requires: compress
          expected_error: The file could not be read or written.
          data:
            file_path: "{{ directory }}/a.pdf"
            output_path: "{{ prefix }}_missing_directory/result.pdf"
            overwrite: false
        - name: Output outside allowlisted directories
          operation: compress
          expect: rejection
          available: true
          requires: compress
          expected_error: The path is not allowed by Home Assistant.
          data:
            file_path: "{{ directory }}/a.pdf"
            output_path: "/stirling_pdf_test_{{ run_id }}/outside.pdf"
            overwrite: false
        - name: Missing input file
          operation: compress
          expect: rejection
          available: true
          requires: compress
          expected_error: The file could not be read or written.
          data:
            file_path: "{{ prefix }}_does_not_exist.pdf"
            output_path: "{{ prefix }}_missing_input.pdf"
            overwrite: false
        - name: Extract pages
          operation: extract_pages
          expect: success
          available: "{{ extract_enabled }}"
          requires: merge
          input_count: 1
          data:
            file_path: "{{ prefix }}_merged.pdf"
            page_numbers: "1"
            output_path: "{{ prefix }}_extracted.pdf"
            overwrite: false
        - name: Wrong extraction output extension
          operation: extract_pages
          expect: rejection
          available: "{{ extract_enabled }}"
          requires: extract_pages
          expected_error: The output must use the .pdf extension.
          data:
            file_path: "{{ directory }}/a.pdf"
            page_numbers: "1"
            output_path: "{{ prefix }}_wrong_extract.zip"
            overwrite: false
        - name: Invalid extraction page selection
          operation: extract_pages
          expect: rejection
          available: "{{ extract_enabled }}"
          requires: extract_pages
          expected_error: Only positive page numbers and ascending ranges are allowed.
          data:
            file_path: "{{ directory }}/a.pdf"
            page_numbers: "0"
            output_path: "{{ prefix }}_invalid_selection.pdf"
            overwrite: false
  - variables:
      expected_successes: >-
        {{ test_cases | selectattr('available') | selectattr('expect', 'eq', 'success') | list | count }}
      expected_rejections: >-
        {{ test_cases | selectattr('available') | selectattr('expect', 'eq', 'rejection') | list | count }}
  - action: persistent_notification.create
    data:
      notification_id: "{{ notification_id }}"
      title: Stirling PDF - Test running
      message: >-
        Directory: {{ directory }}. Inputs: a.pdf and b.pdf.
        Starting count: {{ start_count }}.
        Do not run other PDF actions during this test.
        Expected errors intentionally appear in the trace and logs.
        OCR may take several minutes. The installed integration version
        is not detected automatically; the script name does not confirm a version.
  - alias: Run test cases sequentially
    repeat:
      for_each: "{{ test_cases }}"
      sequence:
        - if: >-
            {{ not repeat.item.available
               or (repeat.item.get('requires', '') != ''
                   and repeat.item.requires not in successful_operations) }}
          then:
            - variables:
                results: >-
                  {{ results + [dict(name=repeat.item.name,
                     status='SKIPPED',
                     detail=('Test option disabled: ' ~ repeat.item.operation
                       if not repeat.item.available else
                       'Prerequisite did not succeed: ' ~ repeat.item.requires))] }}
          else:
            - variables:
                before_count: "{{ states(jobs_entity) | int(-1) }}"
                before_last: "{{ states(last_entity) }}"
                before_time: "{{ state_attr(last_entity, 'last_run') }}"
                reply: {}
            - alias: Call PDF action and capture response
              action: "stirling_pdf.{{ repeat.item.operation }}"
              data: >-
                {{ dict(repeat.item.data, config_entry_id=selected_server)
                   if selected_server else repeat.item.data }}
              response_variable: reply
              continue_on_error: true
            - if: "{{ reply is mapping and reply | count > 0 }}"
              then:
                - wait_template: >-
                    {{ states(jobs_entity) | int(-1) == before_count + 1
                       and is_state(last_entity, repeat.item.operation)
                       and state_attr(last_entity, 'last_run') != before_time }}
                  timeout: "00:00:05"
                  continue_on_timeout: true
              else:
                - delay:
                    milliseconds: 500
            - variables:
                after_count: "{{ states(jobs_entity) | int(-1) }}"
                success_observed: >-
                  {{ before_count >= 0 and reply is mapping
                     and reply.get('operation') == repeat.item.operation
                     and reply.get('output_path') == repeat.item.data.output_path
                     and reply.get('output_size', 0) | int(0) > 0
                     and reply.get('input_count', 0) | int(0)
                       == repeat.item.get('input_count', -1)
                     and after_count == before_count + 1
                     and is_state(last_entity, repeat.item.operation)
                     and state_attr(last_entity, 'last_run') is not none
                     and state_attr(last_entity, 'last_run') != before_time }}
                rejection_observed: >-
                  {{ before_count >= 0 and reply is mapping
                     and reply | count == 0 and after_count == before_count
                     and states(last_entity) == before_last
                     and state_attr(last_entity, 'last_run') == before_time }}
                result_status: >-
                  {% if repeat.item.expect == 'success' and success_observed %}
                    OK
                  {% elif repeat.item.expect == 'rejection' and rejection_observed %}
                    REJECTED
                  {% else %}
                    FAILED
                  {% endif %}
                successful_operations: >-
                  {{ successful_operations + [repeat.item.operation]
                     if result_status == 'OK' else successful_operations }}
                results: >-
                  {{ results + [dict(name=repeat.item.name, status=result_status,
                     before=before_count, after=after_count,
                     size=reply.get('output_size', 0) if reply is mapping else 0,
                     expected=repeat.item.get('expected_error', ''),
                     path=repeat.item.data.output_path)] }}
        - alias: Keep progress visible even if the script stops later
          action: persistent_notification.create
          data:
            notification_id: "{{ notification_id }}"
            title: Stirling PDF - Test running
            message: |-
              {{ results | count }} / {{ test_cases | count }} test cases processed.

              {% for row in results %}
              - {{ row.status }}: {{ row.name }}
              {% endfor %}
  - alias: Final report with automated-check limitations
    action: persistent_notification.create
    data:
      notification_id: "{{ notification_id }}"
      title: Stirling PDF - Test report
      message: |-
        **Test run:** {{ run_id }}
        **Directory:** `{{ directory }}`
        **Installed integration version:** not verified automatically.
        **User-reported version:** {{ reported_version | default('', true) or 'not provided' }} (unverified).
        **Deployment:** {{ deployment_label | default('', true) or 'not provided' }}.
        **Page extraction requested:** {{ extract_enabled }}.

        **Successful:** {{ results | selectattr('status', 'eq', 'OK') | list | count }} / {{ expected_successes }}
        **Rejected, check the reason in the trace:** {{ results | selectattr('status', 'eq', 'REJECTED') | list | count }} / {{ expected_rejections }}
        **Failed:** {{ results | selectattr('status', 'eq', 'FAILED') | list | count }}
        **Skipped:** {{ results | selectattr('status', 'eq', 'SKIPPED') | list | count }}

        {% for row in results %}
        **{{ loop.index }}. {{ row.name }}: {{ row.status }}**
        {% if row.status == 'SKIPPED' %}
        {{ row.detail }}
        {% else %}
        Jobs: {{ row.before }} -> {{ row.after }}. Response size: {{ row.size }} bytes.
        {% if row.expected %}
        Expected rejection reason: {{ row.expected }}
        {% endif %}
        {% endif %}

        {% endfor %}
        **Counter:** {{ start_count }} -> {{ states(jobs_entity) }}; expected for a fully successful run: {{ start_count + expected_successes }}.
        **Last operation:** {{ states(last_entity) }}
        **Time:** {{ state_attr(last_entity, 'last_run') }}
        **Sensors:** `{{ jobs_entity }}`, `{{ last_entity }}`
        **Reachability at the end:** {{ states(reachable_entity) }}

        **If the first normal test fails:** Copy the trace error from
        "Call PDF action and capture response", iteration 1.
        Dependent tests are then skipped, not counted as passed.

        **Please open these outputs:**
        - `{{ prefix }}_merged.pdf`
        - `{{ prefix }}_split.zip`
        - `{{ prefix }}_ocr.pdf`
        - `{{ prefix }}_compressed.pdf`
        {% if extract_enabled %}
        - `{{ prefix }}_extracted.pdf`
        {% endif %}

        **Limitations:** REJECTED means only that there was no success response and statistics did not change. Check the actual reason in the trace; a connection failure could otherwise look similar. Expected errors are intentionally logged.

        File contents, unchanged file bytes, OCR quality, installed integration version, diagnostic redaction and persistence after reload/restart were not checked automatically. This report is not automatic merge approval.

        **Afterwards:** Copy the report, inspect every generated output and check the actual
        reasons for all deliberate rejections in the trace. The extracted
        PDF must contain exactly the first page of the merged PDF. Then note the
        final count, last operation and its timestamp. Manually reload the integration
        and restart HA; all three values must remain unchanged after each step.
        Do not run the script again for these persistence checks.

        **Also check separately:** The actually installed version in
        diagnostics, reconfiguration with unchanged masked secrets,
        diagnostic redaction and preservation of existing entity IDs. Do not delete
        the integration for this test, as that removes its local statistics.
